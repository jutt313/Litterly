[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litterly"
version = "0.1.0"
description = "AI-powered product data enrichment pipeline for e-commerce"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=7.2.0",
    "openai>=1.58.0",
    "anthropic>=0.42.0",
    "google-generativeai>=0.8.0",
    "python-multipart>=0.0.20",
    "websockets>=14.0",
    "aiofiles>=24.0.0",
]

[project.scripts]
litterly = "backend.main:start"
